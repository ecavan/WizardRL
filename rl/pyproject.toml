[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "wizard-rl"
version = "0.1.0"
description = "Self-play reinforcement learning for Wizard (the card game)"
requires-python = ">=3.9"
dependencies = ["numpy", "torch"]

[tool.maturin]
manifest-path = "../crates/wizard-py/Cargo.toml"
python-source = "python"
module-name = "wizard_rl._engine"
