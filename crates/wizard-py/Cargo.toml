[package]
name = "wizard-py"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Python bindings for the Wizard engine (built with maturin from rl/)"
publish = false

# Not a member of the main workspace: it's a Python extension and builds with maturin.
[workspace]

[lib]
name = "_engine"
crate-type = ["cdylib"]

[dependencies]
wizard = { path = "../wizard" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
numpy = "0.29"

[profile.release]
lto = "thin"
codegen-units = 1
