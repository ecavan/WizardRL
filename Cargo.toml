[workspace]
resolver = "2"
members = ["crates/wizard", "crates/wizard-wasm"]
# Built by maturin from rl/ (a Python extension; it links against Python).
exclude = ["crates/wizard-py"]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 3
